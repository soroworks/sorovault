name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The same Postgres CI uses, so the store suite runs before a release
    # rather than skipping.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sorovault
          POSTGRES_PASSWORD: sorovault
          POSTGRES_DB: sorovault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sorovault"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser builds the changelog from history since the last tag.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          # Always the newest patch release: security fixes land there.
          check-latest: true

      # A release must not ship code that fails its own suite.
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://sorovault:sorovault@localhost:5432/sorovault?sslmode=disable
        run: go test ./...

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
