name: Release

on:
  push:
    tags: ["v*"]

# The default for every job in this workflow. A release is the one place
# that writes to the repository, and the job that does it says so; anything
# else added here starts with read-only access.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    # Write access to the contents, and nothing else: GoReleaser creates the
    # GitHub release for the tag and uploads the archives and checksums to
    # it. It does not push an image, publish a package or touch issues, so
    # no other write scope is granted.
    permissions:
      contents: write

    # The same Postgres CI uses, so the store suite runs before a release
    # rather than skipping.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sorovault
          POSTGRES_PASSWORD: sorovault
          POSTGRES_DB: sorovault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sorovault"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      # Pinned to a commit rather than a tag: a tag is a mutable name, so
      # whoever can move it decides what this workflow runs — and this job
      # holds a token that can write to the repository. The version is kept
      # in the comment, which is also what Dependabot updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser builds the changelog from history since the last tag.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
          # Always the newest patch release: security fixes land there.
          check-latest: true

      # A release must not ship code that fails its own suite.
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://sorovault:sorovault@localhost:5432/sorovault?sslmode=disable
        run: go test ./...

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
