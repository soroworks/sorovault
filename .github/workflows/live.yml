name: Live Tests

on:
  schedule:
    # Run weekly on Sundays at 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-live:
    runs-on: ubuntu-latest
    env:
      SOROVAULT_LIVE: "1"
      TESTNET_RPC_URL: "https://horizon.testnet.stellar.org"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          check-latest: true

      - name: Run live smoke test
        run: go test -run TestLiveSmokeTest -v ./internal/stellar...