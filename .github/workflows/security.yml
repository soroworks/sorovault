name: Security

on:
  push:
    branches: [main]
  pull_request:
  # Advisories are published independently of our commits, so scan weekly
  # even when nothing has been pushed.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      # Fails only on vulnerabilities the code can actually reach, so an
      # advisory in an unused corner of a dependency does not block a PR.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
