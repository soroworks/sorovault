name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Kept in step with the toolchain the Stellar SDK requires.
  GO_VERSION: "1.25"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sorovault
          POSTGRES_PASSWORD: sorovault
          POSTGRES_DB: sorovault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sorovault"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # TEST_DATABASE_URL turns on the Postgres half of the store
      # conformance suite; without it those cases would silently skip.
      - name: Test
        env:
          CI: "true"
          TEST_DATABASE_URL: postgres://sorovault:sorovault@localhost:5432/sorovault?sslmode=disable
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # The Go tests prove the generated client is stable; this proves it
  # compiles, strictly, against the SDK it targets.
  codegen-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/codegen/testdata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the SDK and compiler
        run: npm install --no-audit --no-fund
      - name: Type-check the golden client
        run: npm run typecheck

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sorovault:ci .
