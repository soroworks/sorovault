name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the auto-merge bot re-run CI on main after it merges a PR.
  workflow_dispatch:

# The default for every job in this workflow. CI only ever reads the
# repository: it checks code out, builds it and runs tests against it.
# Nothing here writes to the repository, its issues, its pull requests or its
# packages, so the token gets read access to the contents and nothing else.
# A job that needs more declares it for itself.
permissions:
  contents: read

env:
  # Build and test on a Go release that still gets security fixes. The
  # module minimum (go.mod) stays at what the Stellar SDK requires.
  GO_VERSION: "1.26"

jobs:
  test:
    runs-on: ubuntu-latest

    # Read-only, as above: the job checks the code out and runs the suite
    # against it. The Postgres service is a container inside the job rather
    # than a GitHub resource, so it needs no token permission at all.
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sorovault
          POSTGRES_PASSWORD: sorovault
          POSTGRES_DB: sorovault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sorovault"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      # Pinned to a commit rather than a tag: a tag is a mutable name, so
      # whoever can move it decides what this workflow runs. The version is
      # kept in the comment, which is also what Dependabot updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # Always the newest patch release: security fixes land there.
          check-latest: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # TEST_DATABASE_URL turns on the Postgres half of the store
      # conformance suite; without it those cases would silently skip.
      - name: Test
        env:
          CI: "true"
          TEST_DATABASE_URL: postgres://sorovault:sorovault@localhost:5432/sorovault?sslmode=disable
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # The Go tests prove the generated client is stable; this proves it
  # compiles, strictly, against the SDK it targets.
  codegen-typecheck:
    runs-on: ubuntu-latest

    # Read-only: the job checks the code out and type-checks the generated
    # client against the SDK it pins. It writes nothing back.
    permissions:
      contents: read

    defaults:
      run:
        working-directory: internal/codegen/testdata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the SDK and compiler
        run: npm install --no-audit --no-fund
      - name: Type-check the golden client
        run: npm run typecheck

  # The Go tests prove the API works; this proves the Helm chart that
  # deploys it is well-formed and renders.
  helm:
    runs-on: ubuntu-latest

    # Read-only: the job checks the code out and lints the chart in it. It
    # writes nothing back.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Lint chart
        run: helm lint deploy/helm/sorovault --set database.existingSecret=sorovault-db
      - name: Render chart
        run: helm template sorovault deploy/helm/sorovault --set database.existingSecret=sorovault-db

  # The Go tests prove openapi.json matches the router; this proves it is a
  # valid OpenAPI document that client generators will accept.
  openapi-lint:
    runs-on: ubuntu-latest

    # Read-only: the job checks the code out and lints a document in it.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Lint openapi.json
        run: npx --yes @redocly/cli@2.60.0 lint --extends=minimal internal/api/openapi.json

  docker:
    runs-on: ubuntu-latest

    # Read-only: the job checks the code out and builds an image from it.
    # The image is never pushed anywhere, so it needs no write access.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t sorovault:ci .

  # Keeps every action in this repository pinned to a commit, so that the
  # next person to add one cannot quietly reintroduce a mutable tag.
  workflow-hygiene:
    runs-on: ubuntu-latest

    # Read-only: the job checks the workflows out and inspects them.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that every action is pinned to a commit
        run: bash .github/scripts/check-pinned-actions.sh
