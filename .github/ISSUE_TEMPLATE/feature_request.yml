name: Feature request
description: Suggest something sorovault should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: Commands, flags, API shape — whatever makes it concrete.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
