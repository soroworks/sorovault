# Release builds, run by .github/workflows/release.yml when a v* tag is pushed.
# Check locally with: goreleaser release --snapshot --clean
version: 2

project_name: sorovault

before:
  hooks:
    - go mod tidy

builds:
  - id: sorovault
    main: ./cmd/sorovault
    binary: sorovault
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

# One SPDX SBOM per archive, generated with Syft and uploaded alongside the
# archive. Operators can compare it with what they actually deploy.
sboms:
  - artifacts: archive

# Multi-arch images built from the binaries GoReleaser already produced, so
# the embedded migrations travel with the same binary that ships in the
# archives. Dockerfile.release only copies that binary into a runtime image.
dockers_v2:
  - images:
      - ghcr.io/soroworks/sorovault
    tags:
      - "{{ .Version }}"
      - "{{ .Tag }}"
      - latest
    dockerfile: Dockerfile.release
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
